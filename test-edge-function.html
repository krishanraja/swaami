<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Seed Demo Users Edge Function</title>
    <style>
        body {
            font-family: monospace;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        h1 { color: #0ff; }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            font-weight: bold;
        }
        button:hover { background: #0ff; }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .log {
            background: #000;
            padding: 20px;
            border: 1px solid #0f0;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        .log pre { margin: 5px 0; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .info { color: #0ff; }
        .config {
            background: #222;
            padding: 15px;
            border: 1px solid #666;
            margin-bottom: 20px;
        }
        .config input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🧪 Seed Demo Users Edge Function Tester</h1>

    <div class="config">
        <h3>Configuration</h3>
        <label>Supabase URL:</label>
        <input type="text" id="supabaseUrl" value="https://qivqdltstmlxbcaldjzs.supabase.co" />

        <label>Anon Key:</label>
        <input type="password" id="anonKey" placeholder="Paste your VITE_SUPABASE_PUBLISHABLE_KEY here" />

        <label>Count (number of profiles to create):</label>
        <input type="number" id="count" value="10" min="1" max="200" />
    </div>

    <div>
        <button onclick="testSeed()">🌱 Seed Demo Data</button>
        <button onclick="checkStats()">📊 Check Stats</button>
        <button onclick="testCleanup()">🗑️ Cleanup Demo Data</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="log" id="log">
        <pre class="info">Ready. Click a button to test.</pre>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const pre = document.createElement('pre');
            pre.className = type;
            pre.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(pre);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '<pre class="info">Log cleared.</pre>';
        }

        function getConfig() {
            const supabaseUrl = document.getElementById('supabaseUrl').value;
            const anonKey = document.getElementById('anonKey').value;

            if (!supabaseUrl) {
                log('❌ Supabase URL is required', 'error');
                return null;
            }
            if (!anonKey) {
                log('❌ Anon Key is required', 'error');
                return null;
            }

            return { supabaseUrl, anonKey };
        }

        async function testSeed() {
            const config = getConfig();
            if (!config) return;

            const count = parseInt(document.getElementById('count').value) || 10;

            log(`🚀 Calling seed-demo-users edge function...`, 'info');
            log(`   Count: ${count}`, 'info');
            log(`   Generate Photos: false`, 'info');

            const startTime = performance.now();

            try {
                const response = await fetch(
                    `${config.supabaseUrl}/functions/v1/seed-demo-users`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${config.anonKey}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: 'generate',
                            count: count,
                            generatePhotos: false,
                        }),
                    }
                );

                const elapsed = Math.round(performance.now() - startTime);
                log(`📡 Response received in ${elapsed}ms`, 'info');
                log(`   Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`❌ Error: ${errorText}`, 'error');

                    if (response.status === 404) {
                        log('', 'info');
                        log('💡 Edge function NOT FOUND (404)', 'error');
                        log('   This means the function is not deployed.', 'error');
                        log('   Deploy it with:', 'info');
                        log('   npx supabase functions deploy seed-demo-users', 'info');
                    }
                    return;
                }

                const data = await response.json();
                log('✅ Success!', 'success');
                log(`   Profiles Created: ${data.profilesCreated}`, 'success');
                log(`   Tasks Created: ${data.tasksCreated}`, 'success');
                log(`   Photos Generated: ${data.photosGenerated}`, 'success');

                if (data.errors && data.errors.length > 0) {
                    log(`⚠️  Errors: ${data.errors.length}`, 'error');
                    data.errors.forEach(err => log(`     ${err}`, 'error'));
                }

                log('', 'info');
                log('🎉 Demo data created successfully!', 'success');
                log('   Now check your database:', 'info');
                log('   SELECT COUNT(*) FROM profiles WHERE is_demo = true;', 'info');

            } catch (error) {
                const elapsed = Math.round(performance.now() - startTime);
                log(`❌ Failed after ${elapsed}ms: ${error.message}`, 'error');

                if (error.message.includes('Failed to fetch')) {
                    log('', 'info');
                    log('💡 Network Error', 'error');
                    log('   Possible causes:', 'error');
                    log('   1. CORS issue - check ALLOWED_ORIGINS in edge function', 'error');
                    log('   2. Edge function not deployed', 'error');
                    log('   3. Supabase URL is incorrect', 'error');
                }
            }
        }

        async function checkStats() {
            const config = getConfig();
            if (!config) return;

            log(`📊 Checking demo data stats...`, 'info');

            try {
                const supabase = window.supabase || await import('https://esm.sh/@supabase/supabase-js@2');
                const client = supabase.createClient(config.supabaseUrl, config.anonKey);

                // Get demo profile count
                const { count: profileCount, error: profileError } = await client
                    .from('profiles')
                    .select('*', { count: 'exact', head: true })
                    .eq('is_demo', true);

                if (profileError) {
                    log(`❌ Error checking profiles: ${profileError.message}`, 'error');
                    return;
                }

                log(`✅ Demo Profiles: ${profileCount || 0}`, profileCount > 0 ? 'success' : 'error');

                // Get demo profile IDs
                const { data: demoProfiles, error: demoError } = await client
                    .from('profiles')
                    .select('id')
                    .eq('is_demo', true);

                if (demoError) {
                    log(`❌ Error getting demo profile IDs: ${demoError.message}`, 'error');
                    return;
                }

                const demoIds = demoProfiles?.map(p => p.id) || [];

                if (demoIds.length > 0) {
                    const { count: taskCount, error: taskError } = await client
                        .from('tasks')
                        .select('*', { count: 'exact', head: true })
                        .eq('status', 'open')
                        .in('owner_id', demoIds);

                    if (taskError) {
                        log(`❌ Error checking tasks: ${taskError.message}`, 'error');
                    } else {
                        log(`✅ Open Demo Tasks: ${taskCount || 0}`, taskCount > 0 ? 'success' : 'error');
                    }
                } else {
                    log(`ℹ️  No demo profiles found, skipping task check`, 'info');
                }

            } catch (error) {
                log(`❌ Failed: ${error.message}`, 'error');
            }
        }

        async function testCleanup() {
            const config = getConfig();
            if (!config) return;

            if (!confirm('Are you sure you want to DELETE all demo data? This cannot be undone.')) {
                log('❌ Cleanup cancelled', 'info');
                return;
            }

            log(`🗑️  Calling cleanup...`, 'info');

            const startTime = performance.now();

            try {
                const response = await fetch(
                    `${config.supabaseUrl}/functions/v1/seed-demo-users`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${config.anonKey}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: 'cleanup',
                        }),
                    }
                );

                const elapsed = Math.round(performance.now() - startTime);
                log(`📡 Response received in ${elapsed}ms`, 'info');
                log(`   Status: ${response.status}`, response.ok ? 'success' : 'error');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`❌ Error: ${errorText}`, 'error');
                    return;
                }

                const data = await response.json();
                log(`✅ Success!`, 'success');
                log(`   Deleted: ${data.deleted} demo profiles`, 'success');

            } catch (error) {
                const elapsed = Math.round(performance.now() - startTime);
                log(`❌ Failed after ${elapsed}ms: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
